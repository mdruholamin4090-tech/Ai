<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio Pro_official</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        body { 
            background-color: #000; margin: 0; min-height: 100vh; 
            font-family: 'Poppins', sans-serif; color: white; 
            display: flex; justify-content: center; align-items: center; 
        }

        .main-card { 
            background: radial-gradient(circle at top, #122525, #081212); 
            padding: 40px 25px; border-radius: 50px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            width: 90%; max-width: 420px; text-align: center; 
            position: relative; box-shadow: 0 40px 100px rgba(0,0,0,0.8);
        }
        
        .status-badge { 
            background: rgba(255, 71, 87, 0.15); color: #ff4757; 
            padding: 10px 25px; border-radius: 50px; font-size: 13px; 
            margin-bottom: 20px; display: inline-block; border: 1px solid rgba(255, 71, 87, 0.3);
        }
        .status-badge.premium { background: rgba(0, 255, 136, 0.1); color: #00ff88; border-color: rgba(0, 255, 136, 0.3); }
        
        #trial-info { color: #00e7ff; font-size: 18px; font-weight: 600; margin-bottom: 35px; }

        h1 { font-size: 38px; margin: 0 0 40px; font-weight: 600; }
        .pro-text { color: #00ff88; text-shadow: 0 0 25px rgba(0, 255, 136, 0.7); cursor: pointer; }

        .tabs { 
            background: #0d1616; padding: 8px; border-radius: 25px; 
            display: flex; gap: 5px; margin-bottom: 30px; 
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        .tab-btn { 
            flex: 1; padding: 14px 5px; background: transparent; 
            border: none; color: #666; border-radius: 20px; 
            cursor: pointer; font-size: 14px; font-weight: 600;
            transition: 0.3s;
        }
        .tab-btn.active { 
            background: #00ff88; color: #000; 
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
        }
        
        .input-box { 
            width: 100%; padding: 16px; margin: 10px 0; border-radius: 15px; 
            border: 1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.4); 
            color: white; box-sizing: border-box; outline: none; 
        }
        .action-btn { 
            background: #00ff88; color: black; 
            width: 100%; padding: 16px; border: none; border-radius: 15px; 
            font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .action-btn:active { transform: scale(0.96); }

        #loading-overlay { display: none; color: #00ff88; font-size: 13px; margin-top: 10px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10000; justify-content: center; align-items: center; }
        .modal-card { background: white; color: #333; width: 85%; max-width: 380px; padding: 25px; border-radius: 25px; text-align: center; max-height: 90vh; overflow-y: auto; }
        
        .user-id-text { font-size: 11px; color: #555; margin-top: 30px; opacity: 0.7; }
    </style>
</head>
<body>

    <div class="main-card">
        <div id="status-label" class="status-badge">সার্ভার চেক হচ্ছে...</div>
        <div id="trial-info">Credits: --</div>

        <h1>AI Studio <span class="pro-text" id="pro-trigger" onclick="adminTouch()">Pro</span></h1>

        <div class="tabs">
            <button class="tab-btn active" onclick="openTab('ai-video', this)">ভিডিও</button>
            <button class="tab-btn" onclick="openTab('ai-photo', this)">ফটো</button>
            <button class="tab-btn" onclick="openTab('dl-box', this)">ডাউনলোডার</button>
        </div>

        <div id="ai-video" class="tab-content">
            <textarea class="input-box" id="v-prompt" placeholder="ভিডিওর বর্ণনা এখানে লিখুন..."></textarea>
            <button class="action-btn" id="v-gen-btn" onclick="checkTrialAndProcess()">ভিডিও জেনারেট করুন</button>
            <div id="loading-overlay">এআই প্রসেস করছে, দয়া করে অপেক্ষা করুন...</div>
        </div>

        <div id="ai-photo" class="tab-content" style="display:none;">
            <textarea class="input-box" placeholder="ফটোর প্রম্পট লিখুন..."></textarea>
            <button class="action-btn" style="background:#00e7ff">ফটো জেনারেট করুন</button>
        </div>

        <div id="dl-box" class="tab-content" style="display:none;">
            <input type="text" class="input-box" id="dl-input" placeholder="ভিডিওর ডিরেক্ট লিংক দিন...">
            <button class="action-btn" onclick="forceDownload()">সরাসরি ডাউনলোড</button>
            <p style="font-size: 10px; color: #666; margin-top: 12px;">নোট: শুধু .mp4 বা ডিরেক্ট ফাইল লিংক কাজ করবে।</p>
        </div>
        
        <div class="user-id-text">আপনার আইডি: <span id="display-id">Loading...</span></div>
    </div>

    <div class="modal" id="adminModal">
        <div class="modal-card">
            <h2 style="margin: 0;">Admin Control 🛠️</h2>
            <hr style="margin: 15px 0; opacity: 0.2;">
            <p style="font-size: 12px; font-weight: bold; text-align: left;">ইউজার প্রিমিয়াম করুন:</p>
            <input type="text" id="target-user-id" class="input-box" style="color:black; border:1px solid #ddd" placeholder="User ID পেস্ট করুন">
            <button onclick="remoteActivate()" class="action-btn" style="padding: 10px;">এক্টিভ করুন</button>
            <p onclick="closeAdmin()" style="cursor:pointer; margin-top:20px; font-weight:bold; color: #ff4757;">বন্ধ করুন</p>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA...", // আপনার অরিজিনাল কি এখানে থাকবে
            databaseURL: "https://ai-studio-pro-94943-default-rtdb.firebaseio.com",
            projectId: "ai-studio-pro-94943",
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // User ID Logic
        let userId = localStorage.getItem('app_user_id') || 'AI-' + Math.floor(Math.random() * 1000000);
        localStorage.setItem('app_user_id', userId);
        document.getElementById('display-id').innerText = userId;

        let userIsPremium = false;
        let trialLeft = localStorage.getItem('v_trial') === null ? 5 : parseInt(localStorage.getItem('v_trial'));
        
        function updateTrialUI() {
            const trialDiv = document.getElementById('trial-info');
            trialDiv.innerText = userIsPremium ? "Credits: Unlimited ✨" : "Credits: " + trialLeft;
        }
        updateTrialUI();

        // Firebase Sync
        function syncApp() {
            database.ref('users/' + userId).on('value', (snapshot) => {
                const data = snapshot.val();
                const label = document.getElementById('status-label');
                if (data && data.isPremium) {
                    userIsPremium = true;
                    label.innerText = "Premium Account ✅"; label.className = "status-badge premium";
                } else {
                    userIsPremium = false;
                    label.innerText = "সার্ভার কানেক্টেড ✅"; label.className = "status-badge";
                }
                updateTrialUI();
            });
        }
        syncApp();

        // ভিডিও জেনারেশন সিমুলেশন
        function checkTrialAndProcess() {
            const prompt = document.getElementById('v-prompt').value;
            if(!prompt) { alert("প্রম্পট লিখুন!"); return; }

            if (userIsPremium || trialLeft > 0) {
                if(!userIsPremium) { trialLeft--; localStorage.setItem('v_trial', trialLeft); updateTrialUI(); }
                
                const btn = document.getElementById('v-gen-btn');
                const loader = document.getElementById('loading-overlay');
                
                btn.disabled = true;
                btn.innerText = "কাজ চলছে...";
                loader.style.display = "block";

                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerText = "ভিডিও জেনারেট করুন";
                    loader.style.display = "none";
                    alert("ভিডিও তৈরি হয়েছে! (ডাউনলোডার ট্যাব চেক করুন)");
                }, 4000);
            } else { alert("ফ্রি ট্রায়াল শেষ! দয়া করে প্রিমিয়াম কিনুন।"); }
        }

        // পাওয়ারফুল ডাউনলোড ফাংশন
        async function forceDownload() {
            const url = document.getElementById('dl-input').value;
            if(!url) { alert("লিংক দিন!"); return; }

            alert("ডাউনলোড প্রসেস শুরু হচ্ছে...");

            try {
                // ফাইলটি ফেচ করার চেষ্টা
                const response = await fetch(url);
                if(!response.ok) throw new Error('Network response was not ok');
                
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = "AI_Studio_Pro_" + Date.now() + ".mp4";
                document.body.appendChild(link);
                link.click();
                
                document.body.removeChild(link);
                window.URL.revokeObjectURL(blobUrl);
            } catch (e) {
                console.log("Blob download failed, using fallback...");
                // যদি fetch কাজ না করে (CORS এর জন্য), তবে সাধারণ ওপেন লজিক
                const win = window.open(url, '_blank');
                if(!win) alert("পপ-আপ ব্লক করা! দয়া করে ব্রাউজার সেটিংস থেকে অনুমতি দিন।");
            }
        }

        // ট্যাব লজিক
        function openTab(id, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).style.display = 'block';
            btn.classList.add('active');
        }

        // অ্যাডমিন লজিক
        let touchCount = 0;
        function adminTouch() {
            touchCount++;
            if(touchCount === 5) { document.getElementById('adminModal').style.display = 'flex'; touchCount = 0; }
            setTimeout(() => { touchCount = 0; }, 3000);
        }
        function closeAdmin() { document.getElementById('adminModal').style.display = 'none'; }
        function remoteActivate() {
            let target = document.getElementById('target-user-id').value;
            if (target) {
                database.ref('users/' + target).update({ isPremium: true }).then(() => {
                    alert("ইউজার আইডি: " + target + " এখন প্রিমিয়াম!");
                    closeAdmin();
                });
            }
        }
    </script>
</body>
</html>
