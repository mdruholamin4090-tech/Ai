<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio Pro_official</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        body { 
            background-color: #000; margin: 0; min-height: 100vh; 
            font-family: 'Poppins', sans-serif; color: white; 
            display: flex; justify-content: center; align-items: center; 
        }

        .main-card { 
            background: radial-gradient(circle at top, #122525, #081212); 
            padding: 40px 25px; border-radius: 50px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            width: 90%; max-width: 420px; text-align: center; 
            position: relative; box-shadow: 0 40px 100px rgba(0,0,0,0.8);
        }
        
        .status-badge { 
            background: rgba(255, 71, 87, 0.15); color: #ff4757; 
            padding: 10px 25px; border-radius: 50px; font-size: 13px; 
            margin-bottom: 20px; display: inline-block; border: 1px solid rgba(255, 71, 87, 0.3);
        }
        .status-badge.premium { background: rgba(0, 255, 136, 0.1); color: #00ff88; border-color: rgba(0, 255, 136, 0.3); }
        
        #trial-info { color: #00e7ff; font-size: 18px; font-weight: 600; margin-bottom: 35px; }

        h1 { font-size: 38px; margin: 0 0 40px; font-weight: 600; }
        .pro-text { color: #00ff88; text-shadow: 0 0 25px rgba(0, 255, 136, 0.7); cursor: pointer; }

        .tabs { 
            background: #0d1616; padding: 8px; border-radius: 25px; 
            display: flex; gap: 5px; margin-bottom: 30px; 
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        .tab-btn { 
            flex: 1; padding: 14px 5px; background: transparent; 
            border: none; color: #666; border-radius: 20px; 
            cursor: pointer; font-size: 14px; font-weight: 600;
        }
        .tab-btn.active { 
            background: #00ff88; color: #000; 
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
        }
        
        .input-box { 
            width: 100%; padding: 16px; margin: 10px 0; border-radius: 15px; 
            border: 1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.4); 
            color: white; box-sizing: border-box; outline: none; 
        }
        .action-btn { 
            background: #00ff88; color: black; 
            width: 100%; padding: 16px; border: none; border-radius: 15px; 
            font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .action-btn:active { transform: scale(0.95); }

        /* লোডিং এনিমেশন */
        #loading-text { display: none; color: #00ff88; font-size: 14px; margin-top: 10px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10000; justify-content: center; align-items: center; }
        .modal-card { background: white; color: #333; width: 85%; max-width: 380px; padding: 25px; border-radius: 25px; text-align: center; max-height: 90vh; overflow-y: auto; }
        
        .user-id-text { font-size: 12px; color: #444; margin-top: 30px; }
    </style>
</head>
<body>

    <div class="main-card">
        <div id="status-label" class="status-badge">সার্ভার কানেক্ট হচ্ছে...</div>
        <div id="trial-info">Credits: --</div>

        <h1>AI Studio <span class="pro-text" id="pro-trigger" onclick="adminTouch()">Pro</span></h1>

        <div class="tabs">
            <button class="tab-btn active" onclick="openTab('ai-video', this)">ভিডিও</button>
            <button class="tab-btn" onclick="openTab('ai-photo', this)">ফটো</button>
            <button class="tab-btn" onclick="openTab('dl-box', this)">ডাউনলোডার</button>
        </div>

        <div id="ai-video" class="tab-content">
            <textarea class="input-box" id="v-prompt" placeholder="ভিডিওর বর্ণনা লিখুন..."></textarea>
            <button id="v-btn" class="action-btn" onclick="checkTrialAndProcess()">ভিডিও তৈরি করুন</button>
            <div id="loading-text">এআই ভিডিও জেনারেট হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</div>
        </div>

        <div id="ai-photo" class="tab-content" style="display:none;">
            <textarea class="input-box" placeholder="ফটো বর্ণনা লিখুন..."></textarea>
            <button class="action-btn" style="background:#00e7ff">ফটো জেনারেট করুন</button>
        </div>

        <div id="dl-box" class="tab-content" style="display:none;">
            <input type="text" class="input-box" id="dl-input" placeholder="লিংক পেস্ট করুন (MP4/Direct Link)">
            <button class="action-btn" onclick="handleDownload()">ডাউনলোড শুরু</button>
            <p style="font-size: 10px; color: #777; margin-top: 10px;">সরাসরি ফাইল ডাউনলোড না হলে লিঙ্কটি কপি করে ব্রাউজারে পেস্ট করুন।</p>
        </div>
        
        <div class="user-id-text">আপনার আইডি: <span id="display-id">Loading...</span></div>
    </div>

    <div class="modal" id="adminModal">
        <div class="modal-card">
            <h2 style="margin: 0;">Master Admin 🛠️</h2>
            <hr style="margin: 15px 0;">
            <p style="font-size: 12px; font-weight: bold; text-align: left;">ইউজার প্রিমিয়াম এক্টিভেশন:</p>
            <input type="text" id="target-user-id" class="input-box" style="color:black; border:1px solid #ddd" placeholder="ইউজার আইডি (User ID)">
            <button onclick="remoteActivate()" class="action-btn" style="padding: 10px; font-size: 13px;">প্রিমিয়াম দিন</button>
            <hr style="margin: 20px 0;">
            <p style="font-size: 12px; font-weight: bold; text-align: left;">বিজ্ঞাপন ম্যানেজার:</p>
            <input type="text" id="new-ad-img" class="input-box" style="color:black; border:1px solid #ddd" placeholder="ছবির ডিরেক্ট লিংক (.jpg/.png)">
            <input type="text" id="new-ad-url" class="input-box" style="color:black; border:1px solid #ddd" placeholder="ক্লিক করলে যে লিংকে যাবে">
            <button onclick="updateDbAd()" class="action-btn" style="background: #333; color: white; padding: 10px; font-size: 13px;">এড পাবলিশ করুন</button>
            <p onclick="closeAdmin()" style="cursor:pointer; margin-top:20px; font-weight:bold; color: #999;">প্যানেল বন্ধ করুন</p>
        </div>
    </div>

    <script>
        // Firebase Config (একই রাখা হয়েছে)
        const firebaseConfig = {
            apiKey: "AIzaSyA...",
            databaseURL: "https://ai-studio-pro-94943-default-rtdb.firebaseio.com",
            projectId: "ai-studio-pro-94943",
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let userId = localStorage.getItem('app_user_id') || 'AI-' + Math.floor(Math.random() * 1000000);
        localStorage.setItem('app_user_id', userId);
        document.getElementById('display-id').innerText = userId;

        let userIsPremium = false;
        let trialLeft = localStorage.getItem('v_trial') === null ? 5 : parseInt(localStorage.getItem('v_trial'));
        
        function updateTrialUI() {
            const trialInfo = document.getElementById('trial-info');
            if(!userIsPremium) {
                trialInfo.innerText = "Credits: " + trialLeft;
            } else {
                trialInfo.innerText = "Credits: Unlimited ✨";
            }
        }
        updateTrialUI();

        function syncApp() {
            database.ref('users/' + userId).on('value', (snapshot) => {
                const data = snapshot.val();
                const label = document.getElementById('status-label');
                if (data && data.isPremium) {
                    userIsPremium = true;
                    label.innerText = "Premium Account ✅"; label.className = "status-badge premium";
                } else {
                    userIsPremium = false;
                    label.innerText = "সার্ভার কানেক্টেড ✅"; label.className = "status-badge";
                }
                updateTrialUI();
            });
        }
        syncApp();

        // ভিডিও প্রসেসিং ফাংশন (আপডেটেড)
        function checkTrialAndProcess() {
            const prompt = document.getElementById('v-prompt').value;
            if(!prompt) { alert("কিছু একটা লিখুন!"); return; }

            if (userIsPremium || trialLeft > 0) {
                if(!userIsPremium) { 
                    trialLeft--; 
                    localStorage.setItem('v_trial', trialLeft); 
                    updateTrialUI(); 
                }
                
                // লোডিং এনিমেশন শুরু
                const btn = document.getElementById('v-btn');
                const loading = document.getElementById('loading-text');
                btn.disabled = true;
                btn.innerText = "জেনারেটিং...";
                loading.style.display = "block";

                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerText = "ভিডিও তৈরি করুন";
                    loading.style.display = "none";
                    alert("আপনার ভিডিও জেনারেট সফল হয়েছে! (সার্ভার মডিউল কানেক্ট করুন)");
                }, 5000); // ৫ সেকেন্ড লোডিং দেখাবে

            } else { alert("আপনার ৫ বার ফ্রি ট্রায়াল শেষ! প্রিমিয়াম নিন।"); }
        }

        // ডাউনলোডার ফাংশন (নতুন লজিক)
        function handleDownload() {
            let url = document.getElementById('dl-input').value;
            if(!url) {
                alert("ইউআরএল দিন!");
                return;
            }

            // ভিডিও ডাউনলোড করার ট্রিক
            const a = document.createElement('a');
            a.href = url;
            a.target = '_blank';
            a.download = 'ai_studio_video.mp4'; // ফাইল নাম সেট করা
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            alert("ডাউনলোড প্রসেস শুরু হয়েছে...");
        }

        // অ্যাডমিন প্যানেল লজিক একই আছে
        let touchCount = 0;
        function adminTouch() {
            touchCount++;
            if(touchCount === 5) {
                document.getElementById('adminModal').style.display = 'flex';
                touchCount = 0;
            }
            setTimeout(() => { touchCount = 0; }, 3000);
        }
        function closeAdmin() { document.getElementById('adminModal').style.display = 'none'; }
        function remoteActivate() {
            let target = document.getElementById('target-user-id').value;
            if (target) {
                database.ref('users/' + target).update({ isPremium: true }).then(() => {
                    alert("ইউজার " + target + " প্রিমিয়াম হয়েছে!");
                });
            }
        }
        function updateDbAd() {
            let img = document.getElementById('new-ad-img').value;
            let url = document.getElementById('new-ad-url').value;
            if (img) {
                database.ref('ads').set({ imageUrl: img, targetUrl: url }).then(() => {
                    alert("বিজ্ঞাপন আপডেট হয়েছে!");
                });
            }
        }

        function openTab(id, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).style.display = 'block';
            btn.classList.add('active');
        }
    </script>
</body>
</html>
